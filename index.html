<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Barcode / QR Generator</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #007bff, #00c6ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 900px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .main {
      display: flex;
      gap: 20px;
    }

    .left, .right {
      flex: 1;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 10px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-generate { background: #007bff; color: white; }
    .btn-download { background: #28a745; color: white; }

    .barcode-box {
      height: 260px;
      padding: 20px;
      border-radius: 12px;
      background: #f8f9fa;
      border: 1px dashed #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #qrcode canvas,
    #qrcode img {
      width: 180px !important;
      height: 180px !important;
    }

    #barcode svg,
    #qrcode canvas,
    #qrcode img {
      cursor: pointer;
      transition: 0.2s;
    }

    #barcode svg:hover,
    #qrcode canvas:hover,
    #qrcode img:hover {
      transform: scale(1.03);
    }

    #copyToast {
      display: none;
      margin-top: 10px;
      text-align: center;
      color: #28a745;
      font-weight: 600;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .main {
        flex-direction: column;
      }

      .container {
        padding: 15px;
      }

      .barcode-box {
        height: 220px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📦 Barcode / QR Generator</h2>

  <div class="main">

    <!-- INPUT -->
    <div class="left">

      <label>Mã code:</label>
      <input type="text" id="code" placeholder="Nhập số hoặc text">

      <label>Loại mã:</label>
      <select id="mode">
        <option value="barcode">Barcode</option>
        <option value="qr">QR Code</option>
      </select>

      <div id="barcodeTypeWrap">
        <label>Loại barcode:</label>
        <select id="type">
          <option value="CODE128">Code 128</option>
          <option value="EAN13">EAN 13</option>
          <option value="CODE39">Code 39</option>
        </select>
      </div>

      <label>Màu mã:</label>
      <input type="color" id="color" value="#000000">

      <div class="btn-group">
        <button class="btn-generate" onclick="generate()">Tạo mã</button>
        <button class="btn-download" onclick="download()">Download</button>
      </div>

    </div>

    <!-- OUTPUT -->
    <div class="right">

      <div class="barcode-box">
        <div id="barcode"></div>
        <div id="qrcode"></div>
      </div>

      <div id="copyToast">✅ Đã copy ảnh</div>

    </div>

  </div>
</div>

<script>

/* =========================
   MAIN GENERATE
========================= */

function generate() {

  let code = document.getElementById("code").value.trim();
  let mode = document.getElementById("mode").value;
  let type = document.getElementById("type").value;
  let color = document.getElementById("color").value;

  let barcodeDiv = document.getElementById("barcode");
  let qrDiv = document.getElementById("qrcode");

  barcodeDiv.innerHTML = "";
  qrDiv.innerHTML = "";

  if (!code) return;

  // BARCODE
  if (mode === "barcode") {

    let svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    barcodeDiv.appendChild(svg);

    JsBarcode(svg, code, {
      format: type,
      width: 2,
      height: 80,
      displayValue: true,
      lineColor: color,
      textColor: color
    });

    // IMPORTANT FIX: rebind click mỗi lần generate
    svg.onclick = () => copyBarcode(svg);
  }

  // QR
  else {

    new QRCode(qrDiv, {
  text: code,
  width: 360,
  height: 360,
  colorDark: color,
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.H
});

// thêm viền trắng (quiet zone)
setTimeout(() => {
  let canvas = qrDiv.querySelector("canvas");
  let img = qrDiv.querySelector("img");

  if (canvas) addQRBorder(canvas);
  if (img) addQRBorder(img);
}, 100);
  }
}

/* =========================
   COPY SYSTEM
========================= */

async function copyImageToClipboard(blob) {
  try {
    await navigator.clipboard.write([
      new ClipboardItem({ [blob.type]: blob })
    ]);
    showToast();
  } catch (e) {
    alert("Trình duyệt không hỗ trợ copy ảnh");
  }
}

function showToast() {
  let t = document.getElementById("copyToast");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 1500);
}

/* BARCODE COPY */
async function copyBarcode(svg) {

  let xml = new XMLSerializer().serializeToString(svg);
  let img = new Image();

  img.onload = function () {

    let canvas = document.createElement("canvas");
    let ctx = canvas.getContext("2d");

    canvas.width = img.width * 2;
    canvas.height = img.height * 2;

    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.scale(2, 2);
    ctx.drawImage(img, 0, 0);

    canvas.toBlob(copyImageToClipboard);
  };

  img.src = "data:image/svg+xml;base64," + btoa(xml);
}

/* QR COPY */
function copyQR(canvasSource) {

  let canvas = document.createElement("canvas");
  let ctx = canvas.getContext("2d");

  canvas.width = canvasSource.width + 40;
  canvas.height = canvasSource.height + 40;

  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.drawImage(canvasSource, 20, 20);

  canvas.toBlob(copyImageToClipboard);
}

/* =========================
   DOWNLOAD
========================= */

function download() {

  let qr = document.querySelector("#qrcode canvas");
  let svg = document.querySelector("#barcode svg");

  if (qr) {
    let a = document.createElement("a");
    a.download = "qr.png";
    a.href = qr.toDataURL();
    a.click();
    return;
  }

  if (svg) {
    let xml = new XMLSerializer().serializeToString(svg);
    let img = new Image();

    img.onload = function () {
      let canvas = document.createElement("canvas");
      let ctx = canvas.getContext("2d");

      canvas.width = img.width;
      canvas.height = img.height;

      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);

      let a = document.createElement("a");
      a.download = "barcode.png";
      a.href = canvas.toDataURL();
      a.click();
    };

    img.src = "data:image/svg+xml;base64," + btoa(xml);
  }
}

/* EVENTS */
document.getElementById("code").addEventListener("input", generate);
document.getElementById("color").addEventListener("input", generate);
document.getElementById("mode").addEventListener("change", () => {
  document.getElementById("barcodeTypeWrap").style.display =
    document.getElementById("mode").value === "qr" ? "none" : "block";
  generate();
});

document.addEventListener("click", function (e) {

  let qrCanvas = e.target.closest("#qrcode canvas");
  let qrImg = e.target.closest("#qrcode img");

  // CASE 1: QR là canvas (phổ biến nhất)
  if (qrCanvas) {
    copyQR(qrCanvas);
    showToast();
    return;
  }

  // CASE 2: QR là img (fallback của qrcodejs)
  if (qrImg) {

    let canvas = document.createElement("canvas");
    let ctx = canvas.getContext("2d");

    canvas.width = qrImg.width;
    canvas.height = qrImg.height;

    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(qrImg, 0, 0);

    canvas.toBlob(copyImageToClipboard);

    showToast();
  }
});

function addQRBorder(source) {

  let canvas = document.createElement("canvas");
  let ctx = canvas.getContext("2d");

  let size = source.width;

  // tạo viền trắng 20px mỗi bên
  let padding = 40;

  canvas.width = size + padding;
  canvas.height = size + padding;

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.drawImage(source, padding / 2, padding / 2);

  // thay QR cũ bằng QR có viền
  let qrDiv = document.getElementById("qrcode");
  qrDiv.innerHTML = "";
  qrDiv.appendChild(canvas);

  // giữ lại click copy
  canvas.onclick = () => copyQR(canvas);
}

</script>

</body>
</html>
